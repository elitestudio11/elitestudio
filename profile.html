<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | Elite Studio</title>
    <meta name="description" content="عرض معلومات العضو في سيرفر Discord">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f23;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-screen.hidden {
            display: none;
        }
        
        .loader {
            text-align: center;
        }
        
        .loader-circle {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(88, 101, 242, 0.2);
            border-top-color: #5865f2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loader-text {
            color: #5865f2;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        header {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #5865f2, #7289da);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .brand-highlight {
            color: #5865f2;
        }
        
        .profile-page {
            min-height: 100vh;
            padding: 120px 0 80px;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }
        
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .avatar-container {
            position: relative;
        }
        
        .avatar-container img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 4px solid #1a1a2e;
        }
        
        .status-online { background: #43b581; }
        .status-idle { background: #faa61a; }
        .status-dnd { background: #f04747; }
        .status-offline { background: #747f8d; }
        
        .user-info {
            flex: 1;
        }
        
        .user-info h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
        }
        
        .user-info p {
            color: #b8b8b8;
            margin: 0 0 20px 0;
            font-size: 1.2rem;
        }
        
        .badges-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        
        .badge-staff { background: rgba(88, 101, 242, 0.2); color: #5865f2; border: 1px solid #5865f2; }
        .badge-partner { background: rgba(67, 181, 129, 0.2); color: #43b581; border: 1px solid #43b581; }
        .badge-booster { background: rgba(245, 96, 165, 0.2); color: #f560a5; border: 1px solid #f560a5; }
        .badge-vip { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid #ffd700; }
        .badge-admin { background: rgba(240, 71, 71, 0.2); color: #f04747; border: 1px solid #f04747; }
        .badge-moderator { background: rgba(114, 137, 218, 0.2); color: #7289da; border: 1px solid #7289da; }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        
        .stat-box {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #5865f2;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #b8b8b8;
            font-size: 0.9rem;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .detail-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
        }
        
        .detail-card h3 {
            color: white;
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .detail-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .detail-item:last-child {
            border-bottom: none;
        }
        
        .detail-item > div:first-child {
            color: #b8b8b8;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .detail-item > div:last-child {
            color: white;
            font-weight: 600;
        }
        
        .roles-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .role-pill {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid;
        }
        
        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .permission-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: rgba(67, 181, 129, 0.1);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .permission-icon {
            color: #43b581;
        }
        
        .activity-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .error-message {
            background: rgba(240, 71, 71, 0.2);
            border: 1px solid #f04747;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 50px 0;
        }
        
        .error-message i {
            font-size: 3rem;
            color: #f04747;
            margin-bottom: 15px;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader">
            <div class="loader-circle"></div>
            <div class="loader-text">جاري التحميل...</div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="container">
            <nav class="nav">
                <div class="brand">
                    <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
                        <div class="logo">
                            <i class="fas fa-palette"></i>
                        </div>
                        <span>Elite <span class="brand-highlight">Studio</span></span>
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Profile Page Content -->
    <div class="profile-page">
        <div class="container">
            <!-- Back Button -->
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-right"></i>
                <span>العودة للرئيسية</span>
            </a>

            <!-- Profile Content (will be filled dynamically) -->
            <div id="profileContent">
                <!-- سيتم ملء المحتوى هنا -->
            </div>
        </div>
    </div>

    <script>
        // تكوين API
        const API_URL = 'http://localhost:3000'; // غير هذا إلى عنوان API الخاص بك
        
        // جلب معرف المستخدم من URL
        function getUserIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || urlParams.get('userId');
        }
        
        // جلب بيانات البروفايل
        async function fetchProfile() {
            const userId = getUserIdFromURL();
            
            if (!userId) {
                showError('لم يتم تحديد معرف المستخدم. الرجاء إضافة ?id=USER_ID إلى الرابط');
                return;
            }
            
            try {
                console.log(`جاري جلب البيانات للمستخدم: ${userId}`);
                
                const response = await fetch(`${API_URL}/api/user/profile/${userId}`);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'فشل في جلب البيانات');
                }
                
                const data = await response.json();
                console.log('تم جلب البيانات بنجاح:', data);
                
                displayProfile(data);
                
            } catch (error) {
                console.error('خطأ:', error);
                showError(`خطأ في جلب البيانات: ${error.message}`);
            } finally {
                document.getElementById('loadingScreen').classList.add('hidden');
            }
        }
        
        // عرض البروفايل
        function displayProfile(data) {
            const profileContent = document.getElementById('profileContent');
            
            // حالة المستخدم
            const statusClass = `status-${data.status || 'offline'}`;
            const statusText = getStatusText(data.status);
            
            profileContent.innerHTML = `
                <!-- Profile Header -->
                <div class="profile-card">
                    <div class="profile-header">
                        <!-- Avatar -->
                        <div class="avatar-container">
                            <img src="${data.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" alt="Avatar">
                            <div class="status-indicator ${statusClass}" title="${statusText}"></div>
                        </div>

                        <!-- User Info -->
                        <div class="user-info">
                            <h1>${data.globalName || data.username}</h1>
                            <p>@${data.username}${data.discriminator !== '0' ? '#' + data.discriminator : ''}</p>
                            
                            <!-- Badges -->
                            <div class="badges-container">
                                ${data.badges.map(badge => `
                                    <div class="badge badge-${badge.type}">
                                        <i class="fas fa-${getBadgeIcon(badge.type)}"></i> ${badge.name}
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Stats -->
                            <div class="profile-stats">
                                <div class="stat-box">
                                    <div class="stat-value">${data.points.toLocaleString()}</div>
                                    <div class="stat-label">النقاط</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-value">${data.level}</div>
                                    <div class="stat-label">المستوى</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-value">${data.messages.toLocaleString()}</div>
                                    <div class="stat-label">الرسائل</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-value">#${data.rank || 'N/A'}</div>
                                    <div class="stat-label">الترتيب</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Details Grid -->
                <div class="details-grid">
                    <!-- User Details -->
                    <div class="detail-card">
                        <h3>
                            <i class="fas fa-id-card"></i>
                            معلومات الحساب
                        </h3>
                        
                        <div class="detail-item">
                            <div>معرف المستخدم</div>
                            <div style="font-family: monospace;">${data.userId}</div>
                        </div>
                        
                        <div class="detail-item">
                            <div>تاريخ الإنشاء</div>
                            <div>${formatDate(data.accountCreated)}</div>
                        </div>
                        
                        <div class="detail-item">
                            <div>تاريخ الانضمام</div>
                            <div>${formatDate(data.serverJoined)}</div>
                        </div>
                        
                        <div class="detail-item">
                            <div>حالة التعزيز</div>
                            <div>${data.boostStatus}</div>
                        </div>
                    </div>

                    <!-- Roles -->
                    <div class="detail-card">
                        <h3>
                            <i class="fas fa-user-tag"></i>
                            الرتب <span style="background: rgba(255, 255, 255, 0.1); padding: 2px 10px; border-radius: 20px; font-size: 0.9rem;">${data.roles.length}</span>
                        </h3>
                        
                        <div class="roles-container">
                            ${data.roles.length > 0 ? data.roles.map(role => `
                                <div class="role-pill" style="background: ${hexToRgba(role.color, 0.2)}; border-color: ${role.color}; color: ${role.color};">
                                    <i class="fas ${role.icon}"></i> ${role.name}
                                </div>
                            `).join('') : '<p style="color: #b8b8b8;">لا توجد رتب</p>'}
                        </div>
                    </div>

                    <!-- Permissions -->
                    <div class="detail-card">
                        <h3>
                            <i class="fas fa-shield-alt"></i>
                            الصلاحيات
                        </h3>
                        
                        <div class="permissions-grid">
                            ${data.permissions.map(perm => `
                                <div class="permission-item">
                                    <i class="fas fa-check-circle permission-icon"></i>
                                    <span>${perm}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Recent Activity -->
                    <div class="detail-card">
                        <h3>
                            <i class="fas fa-history"></i>
                            النشاط الأخير
                        </h3>
                        
                        ${data.recentActivity.length > 0 ? data.recentActivity.map(activity => `
                            <div class="activity-item">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                    <span style="color: white; font-size: 0.9rem;">
                                        <i class="fas fa-bell"></i> ${activity.description}
                                    </span>
                                    <span style="color: #b8b8b8; font-size: 0.8rem;">منذ ${activity.time}</span>
                                </div>
                            </div>
                        `).join('') : '<p style="color: #b8b8b8;">لا يوجد نشاط حديث</p>'}
                    </div>

                    <!-- Stats Summary -->
                    <div class="detail-card">
                        <h3>
                            <i class="fas fa-chart-bar"></i>
                            إحصائيات إضافية
                        </h3>
                        
                        <div class="detail-item">
                            <div>الجوائز المشارك بها</div>
                            <div>${data.prizesJoined}</div>
                        </div>
                        
                        <div class="detail-item">
                            <div>الجوائز المكتسبة</div>
                            <div>${data.prizesWon}</div>
                        </div>
                        
                        <div class="detail-item">
                            <div>الحالة الحالية</div>
                            <div>${statusText}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // عرض رسالة خطأ
        function showError(message) {
            const profileContent = document.getElementById('profileContent');
            profileContent.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h2>حدث خطأ</h2>
                    <p>${message}</p>
                    <br>
                    <a href="index.html" class="back-btn">العودة للرئيسية</a>
                </div>
            `;
        }
        
        // وظائف مساعدة
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ar-SA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
        
        function hexToRgba(hex, alpha) {
            if (!hex || hex === '#000000') hex = '#99AAB5';
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        function getStatusText(status) {
            const statuses = {
                'online': 'متصل',
                'idle': 'خامل',
                'dnd': 'مشغول',
                'offline': 'غير متصل'
            };
            return statuses[status] || 'غير متصل';
        }
        
        function getBadgeIcon(type) {
            const icons = {
                'staff': 'user-shield',
                'partner': 'handshake',
                'booster': 'gem',
                'vip': 'star',
                'admin': 'crown',
                'moderator': 'shield-alt',
                'developer': 'code',
                'hypesquad': 'bolt',
                'early-supporter': 'clock'
            };
            return icons[type] || 'certificate';
        }
        
        // تحميل البروفايل عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            fetchProfile();
        });
    </script>
</body>
</html>
