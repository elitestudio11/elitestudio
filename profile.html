<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | Elite Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .avatar-container {
            position: relative;
        }

        .avatar-container img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.1);
        }

        .status-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 4px solid #1a1a2e;
        }

        .status-online { background: #43b581; }
        .status-idle { background: #faa61a; }
        .status-dnd { background: #f04747; }
        .status-offline { background: #747f8d; }

        .user-info {
            flex: 1;
        }

        .user-info h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .user-tag {
            color: #b8b8b8;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .badges-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .badge-owner {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
        }

        .badge-booster {
            background: rgba(244, 63, 159, 0.2);
            border: 1px solid #f43f9f;
            color: #f43f9f;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #5865f2;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #b8b8b8;
            font-size: 0.9rem;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
        }

        .detail-card h3 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .detail-label {
            color: #b8b8b8;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .detail-value {
            color: white;
            font-weight: bold;
        }

        .roles-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .role-pill {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .permission-icon {
            color: #43b581;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
        }

        .error {
            background: rgba(240, 71, 71, 0.2);
            border: 1px solid #f04747;
            color: #f04747;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(88, 101, 242, 0.2);
            border: 1px solid #5865f2;
            color: #5865f2;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(88, 101, 242, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn" style="margin-bottom: 30px;">
            <i class="fas fa-arrow-right"></i>
            <span>العودة للرئيسية</span>
        </a>

        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>جاري تحميل البيانات...</p>
        </div>

        <div id="error" style="display: none;"></div>

        <div id="profileContent" style="display: none;">
            <!-- Profile Header -->
            <div class="profile-card">
                <div class="profile-header">
                    <div class="avatar-container">
                        <img id="profileAvatar" src="" alt="Avatar">
                        <div class="status-indicator" id="statusIndicator"></div>
                    </div>

                    <div class="user-info">
                        <h1 id="profileUsername">Loading...</h1>
                        <p class="user-tag" id="profileTag">@username</p>
                        
                        <div class="badges-container" id="badgesContainer"></div>

                        <div class="profile-stats">
                            <div class="stat-box">
                                <div class="stat-value" id="rolesCount">0</div>
                                <div class="stat-label">الرتب</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value" id="permissionsCount">0</div>
                                <div class="stat-label">الصلاحيات</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value" id="statusText">غير متصل</div>
                                <div class="stat-label">الحالة</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Details Grid -->
            <div class="details-grid">
                <!-- معلومات الحساب -->
                <div class="detail-card">
                    <h3>
                        <i class="fas fa-id-card"></i>
                        معلومات الحساب
                    </h3>
                    
                    <div class="detail-item">
                        <div class="detail-label">معرف المستخدم</div>
                        <div class="detail-value" id="userId" style="font-family: monospace;">-</div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">تاريخ الانضمام للسيرفر</div>
                        <div class="detail-value" id="serverJoined">-</div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">اسم العرض</div>
                        <div class="detail-value" id="displayName">-</div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">بوت</div>
                        <div class="detail-value" id="isBot">-</div>
                    </div>
                </div>

                <!-- الرتب -->
                <div class="detail-card">
                    <h3>
                        <i class="fas fa-user-tag"></i>
                        الرتب
                    </h3>
                    
                    <div class="roles-container" id="rolesContainer">
                        <p style="color: #b8b8b8;">لا توجد رتب</p>
                    </div>
                </div>

                <!-- الصلاحيات -->
                <div class="detail-card">
                    <h3>
                        <i class="fas fa-shield-alt"></i>
                        الصلاحيات
                    </h3>
                    
                    <div class="permissions-grid" id="permissionsGrid">
                        <p style="color: #b8b8b8;">لا توجد صلاحيات</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // الحصول على معرف المستخدم من URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        // رابط API الخاص بك
        const API_URL = 'https://elitestudio11.github.io/elitestudio11/profile.html';

        // تحميل البيانات
        async function loadProfile() {
            if (!userId) {
                showError('الرجاء تحديد معرف المستخدم في الرابط (?id=USER_ID)');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/member/${userId}`);
                const result = await response.json();

                if (!result.success) {
                    showError(result.error || 'فشل في تحميل البيانات');
                    return;
                }

                displayProfile(result.data);
            } catch (error) {
                console.error('خطأ:', error);
                showError('فشل في الاتصال بالخادم. تأكد من تشغيل البوت والخادم.');
            }
        }

        // عرض البروفايل
        function displayProfile(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('profileContent').style.display = 'block';

            // المعلومات الأساسية
            document.getElementById('profileAvatar').src = data.avatar;
            document.getElementById('profileUsername').textContent = data.username;
            document.getElementById('profileTag').textContent = `@${data.username}`;
            document.getElementById('userId').textContent = data.id;
            document.getElementById('displayName').textContent = data.displayName;
            document.getElementById('isBot').textContent = data.bot ? 'نعم' : 'لا';

            // الحالة
            const statusIndicator = document.getElementById('statusIndicator');
            statusIndicator.className = `status-indicator status-${data.status}`;
            
            const statusText = {
                'online': 'متصل',
                'idle': 'خامل',
                'dnd': 'مشغول',
                'offline': 'غير متصل'
            };
            document.getElementById('statusText').textContent = statusText[data.status] || 'غير معروف';

            // تاريخ الانضمام
            if (data.joinedAt) {
                const joinDate = new Date(data.joinedAt);
                document.getElementById('serverJoined').textContent = joinDate.toLocaleDateString('ar-SA');
            }

            // الباجات
            const badgesContainer = document.getElementById('badgesContainer');
            badgesContainer.innerHTML = '';
            
            if (data.isOwner) {
                const badge = document.createElement('div');
                badge.className = 'badge badge-owner';
                badge.innerHTML = '<i class="fas fa-crown"></i> مالك السيرفر';
                badgesContainer.appendChild(badge);
            }
            
            if (data.premiumSince) {
                const badge = document.createElement('div');
                badge.className = 'badge badge-booster';
                badge.innerHTML = '<i class="fas fa-gem"></i> معزز';
                badgesContainer.appendChild(badge);
            }

            // الرتب
            const rolesContainer = document.getElementById('rolesContainer');
            rolesContainer.innerHTML = '';
            
            if (data.roles && data.roles.length > 0) {
                data.roles.forEach(role => {
                    const roleElement = document.createElement('div');
                    roleElement.className = 'role-pill';
                    roleElement.style.cssText = `
                        background: ${hexToRgba(role.color, 0.2)};
                        border: 1px solid ${role.color};
                        color: ${role.color || '#fff'};
                    `;
                    roleElement.innerHTML = `<i class="fas fa-circle"></i> ${role.name}`;
                    rolesContainer.appendChild(roleElement);
                });
                document.getElementById('rolesCount').textContent = data.roles.length;
            } else {
                rolesContainer.innerHTML = '<p style="color: #b8b8b8;">لا توجد رتب</p>';
            }

            // الصلاحيات
            const permissionsGrid = document.getElementById('permissionsGrid');
            permissionsGrid.innerHTML = '';
            
            if (data.permissions && data.permissions.length > 0) {
                // ترجمة الصلاحيات المهمة
                const permissionNames = {
                    'Administrator': 'مدير',
                    'ManageGuild': 'إدارة السيرفر',
                    'ManageRoles': 'إدارة الرتب',
                    'ManageChannels': 'إدارة القنوات',
                    'KickMembers': 'طرد الأعضاء',
                    'BanMembers': 'حظر الأعضاء',
                    'ManageMessages': 'إدارة الرسائل',
                    'ManageNicknames': 'إدارة الألقاب',
                    'ManageEmojisAndStickers': 'إدارة الإيموجي والملصقات',
                    'ViewAuditLog': 'عرض سجل التدقيق',
                    'ModerateMembers': 'إدارة الأعضاء'
                };

                const importantPermissions = data.permissions.filter(perm => 
                    permissionNames[perm]
                );

                if (importantPermissions.length > 0) {
                    importantPermissions.forEach(permission => {
                        const permElement = document.createElement('div');
                        permElement.className = 'permission-item';
                        permElement.innerHTML = `
                            <i class="fas fa-check-circle permission-icon"></i>
                            <span>${permissionNames[permission]}</span>
                        `;
                        permissionsGrid.appendChild(permElement);
                    });
                } else {
                    permissionsGrid.innerHTML = '<p style="color: #b8b8b8;">صلاحيات عادية</p>';
                }

                document.getElementById('permissionsCount').textContent = importantPermissions.length;
            } else {
                permissionsGrid.innerHTML = '<p style="color: #b8b8b8;">لا توجد صلاحيات خاصة</p>';
            }
        }

        // عرض الخطأ
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'block';
            errorDiv.className = 'error';
            errorDiv.innerHTML = `
                <i class="fas fa-exclamation-triangle"></i>
                <p>${message}</p>
            `;
        }

        // تحويل Hex إلى RGBA
        function hexToRgba(hex, alpha) {
            if (!hex || hex === '#000000') return `rgba(255, 255, 255, ${alpha})`;
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // تحميل البيانات عند فتح الصفحة
        loadProfile();
    </script>
</body>
</html>
